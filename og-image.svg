<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative glow circles -->
  <circle cx="250" cy="315" r="240" fill="#818cf8" opacity="0.15"/>
  <circle cx="1000" cy="150" r="180" fill="#c084fc" opacity="0.12"/>
  <circle cx="850" cy="500" r="220" fill="#38bdf8" opacity="0.1"/>

  <!-- Left Side: Spinning Wheel Graphic -->
  <g transform="translate(260, 315)" filter="url(#ogShadow)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="180" fill="#ffffff" stroke="#e0e7ff" stroke-width="8"/>

    <!-- 8 Segments -->
    <!-- 0 - 45 -->
    <path d="M0 0 L170 0 A170 170 0 0 1 120.2 120.2 Z" fill="#ef4444"/>
    <!-- 45 - 90 -->
    <path d="M0 0 L120.2 120.2 A170 170 0 0 1 0 170 Z" fill="#f97316"/>
    <!-- 90 - 135 -->
    <path d="M0 0 L0 170 A170 170 0 0 1 -120.2 120.2 Z" fill="#eab308"/>
    <!-- 135 - 180 -->
    <path d="M0 0 L-120.2 120.2 A170 170 0 0 1 -170 0 Z" fill="#22c55e"/>
    <!-- 180 - 225 -->
    <path d="M0 0 L-170 0 A170 170 0 0 1 -120.2 -120.2 Z" fill="#06b6d4"/>
    <!-- 225 - 270 -->
    <path d="M0 0 L-120.2 -120.2 A170 170 0 0 1 0 -170 Z" fill="#3b82f6"/>
    <!-- 270 - 315 -->
    <path d="M0 0 L0 -170 A170 170 0 0 1 120.2 -120.2 Z" fill="#8b5cf6"/>
    <!-- 315 - 360 -->
    <path d="M0 0 L120.2 -120.2 A170 170 0 0 1 170 0 Z" fill="#ec4899"/>

    <!-- Segment labels -->
    <text x="75" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Yes</text>
    <text x="-40" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Pizza</text>
    <text x="-95" y="-30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">No</text>
    <text x="35" y="-85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Burger</text>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="42" fill="#ffffff" filter="url(#ogShadow)"/>
    <circle cx="0" cy="0" r="26" fill="#312e81"/>

    <!-- Top Pointer -->
    <polygon points="0,-140 -20,-195 20,-195" fill="#f43f5e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Content & Typography -->
  <g transform="translate(540, 0)">
    <!-- Badge -->
    <rect x="0" y="145" width="230" height="42" rx="21" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="24" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e0e7ff" letter-spacing="1">VECTRIC.ONLINE</text>

    <!-- Main Title -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Spin the Wheel</text>
    
    <!-- Subtitle -->
    <text x="0" y="315" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">Random Decision Maker</text>

    <!-- Description -->
    <text x="0" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" fill="#e2e8f0" opacity="0.9">
      Make fast decisions, pick names, play games, and choose options!
    </text>

    <!-- Highlights / Features -->
    <g transform="translate(0, 440)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="165" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">⚡ 100% Free</text>

      <!-- Item 2 -->
      <rect x="185" y="0" width="165" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
      <text x="203" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">🎯 100% Fair</text>

      <!-- Item 3 -->
      <rect x="370" y="0" width="195" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
      <text x="388" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">🎨 Fully Custom</text>
    </g>
  </g>
</svg>
